// docker-compose.yml
// Local Docker development environment - WHAT IT DOES: Runs PostgreSQL + Node locally

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: timebank_db
    environment:
      POSTGRES_USER: timebank_user
      POSTGRES_PASSWORD: timebank_password
      POSTGRES_DB: timebank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - timebank_network

  # Node.js Application
  app:
    build: .
    container_name: timebank_app
    environment:
      DATABASE_URL: postgresql://timebank_user:timebank_password@db:5432/timebank
      NODE_ENV: development
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - timebank_network
    command: npm run dev

  # PgAdmin (PostgreSQL UI - optional)
  pgadmin:
    image: dpage/pgadmin4
    container_name: timebank_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - timebank_network

volumes:
  postgres_data:

networks:
  timebank_network:
    driver: bridge
